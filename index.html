<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BodyTrack Pro | Global Precision</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --primary:#1a73e8; --success:#34a853; --warning:#1a73e8; --danger:#ea4335; --under:#03a9f4;
  --bg:#f8f9fa; --card:#ffffff; --text:#202124; --muted:#5f6368; --border:#dadce0;
  --radius:12px; --shadow:0 2px 10px rgba(0,0,0,0.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;}

header{background:var(--primary); color:#fff; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100;}
.header-actions{display:flex; gap:12px; align-items:center;}
.user-badge{background:rgba(255,255,255,0.2); padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600;}

.tabs{background:#fff; display:flex; justify-content:center; border-bottom:1px solid var(--border); overflow-x:auto;}
.tab{padding:16px 24px; font-size:14px; cursor:pointer; color:var(--muted); border-bottom:3px solid transparent; transition:0.2s; font-weight:600; white-space:nowrap;}
.tab.active{color:var(--primary); border-bottom-color:var(--primary);}

.container{max-width:1100px; margin:0 auto; padding:20px;}
.tab-content{display:none;}
.tab-content.active{display:block;}

.card{background:var(--card); border-radius:var(--radius); padding:24px; margin-bottom:20px; box-shadow:var(--shadow); border:1px solid var(--border);}
.card-title{font-size:14px; font-weight:700; margin-bottom:20px; color:var(--primary); text-transform:uppercase;}

.grid-stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px;}
.stat-item{padding:16px; border-radius:10px; border:2px solid var(--border); background:#fff; position:relative;}
.stat-label{font-size:11px; color:var(--muted); font-weight:700;}
.stat-value{font-size:24px; font-weight:800; margin:4px 0;}

.status-blue{border-color:var(--under); color:var(--under);}
.status-green{border-color:var(--success); color:var(--success);}
.status-red{border-color:var(--danger); color:var(--danger);}

.trend-selectors{display:flex; gap:8px; overflow-x:auto; margin-bottom:15px; padding:10px 0;}
.chip{padding:8px 16px; border-radius:20px; background:#fff; border:1px solid var(--border); cursor:pointer; font-size:12px; font-weight:600; transition:0.2s;}
.chip.active{background:var(--primary); color:white; border-color:var(--primary);}

.btn{border:none; cursor:pointer; border-radius:8px; font-size:13px; font-weight:600; padding:10px 18px; display:inline-flex; align-items:center; gap:8px;}
.btn-success{background:var(--success); color:white;}
.btn-primary{background:white; color:var(--primary); border:1px solid var(--primary);}

/* --- STAGGERED ANATOMY --- */
.body-container{display:flex; justify-content:space-around; gap:100px; flex-wrap:wrap; padding:40px 0;}
.silhouette{position:relative; width:120px; height:240px; background:#e9ecef; border-radius:30px;}
.seg-label{position:absolute; background:#fff; border:1px solid #ddd; padding:4px 8px; font-size:10px; border-radius:6px; box-shadow:var(--shadow); width:90px; text-align:center; font-weight:800;}
/* Balanced Offsets to prevent overlapping */
.l-arm{top:20px; left:-105px;}
.r-arm{top:20px; right:-105px;}
.trunk{top:90px; left:15px;}
.l-leg{top:170px; left:-95px;}
.r-leg{top:170px; right:-95px;}

.form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:15px;}
.form-group{display:flex; flex-direction:column; gap:5px;}
.form-group label{font-size:11px; font-weight:700; color:var(--muted);}
.form-group input, .form-group select{padding:10px; border:1.5px solid var(--border); border-radius:8px;}

.modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:500; align-items:center; justify-content:center; padding:20px;}
.modal-content{background:#fff; border-radius:16px; width:100%; max-width:800px; max-height:90vh; overflow-y:auto; padding:24px;}

#toast{position:fixed; bottom:30px; right:30px; background:#323232; color:#fff; padding:14px 28px; border-radius:8px; display:none; z-index:1000;}
</style>
</head>
<body>

<header>
  <div class="brand">BODYTRACK PRO</div>
  <div class="header-actions">
    <div class="user-badge" id="headerIdentity">Krit | --</div>
    <button class="btn btn-primary" onclick="showModal('userModal')">Accounts</button>
    <button class="btn btn-success" onclick="prepareForm()">＋ Add Entry</button>
  </div>
</header>

<nav class="tabs">
  <div class="tab active" onclick="nav('dashboard')">Analytics</div>
  <div class="tab" onclick="nav('history')">History</div>
  <div class="tab" onclick="nav('scan')">Scan Analysis</div>
  <div class="tab" onclick="nav('profile')">Profile</div>
</nav>

<div class="container">
  <!-- ANALYTICS -->
  <div id="v-dashboard" class="tab-content active">
    <div class="grid-stats" id="statsRow"></div>
    <div class="card" style="margin-top:20px;">
        <div class="card-title">Progression Intelligence</div>
        <div class="trend-selectors" id="trendChips"></div>
        <div style="height:350px;"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="card">
        <div class="card-title">Segmental Analytics</div>
        <div class="body-container">
            <div id="leanSil"></div>
            <div id="fatSil"></div>
        </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="v-history" class="tab-content">
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
          <div class="card-title">Archives</div>
          <select id="histFilter" onchange="renderHistory()" style="padding:5px; border-radius:5px; border:1px solid #ccc;">
              <option value="all">All Users</option>
          </select>
      </div>
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="text-align:left; border-bottom:2px solid var(--border);"><th style="padding:12px">User</th><th>Date</th><th>Weight</th><th>Muscle</th><th>Action</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <!-- SCAN -->
  <div id="v-scan" class="tab-content">
    <div class="card" style="text-align:center; padding:50px;">
        <div class="card-title">Optical Report Recognition</div>
        <input type="file" id="imgInp" accept="image/*" style="display:none" onchange="processImage(this)">
        <button class="btn btn-success" style="padding:20px 40px;" onclick="document.getElementById('imgInp').click()">Upload Report Photo</button>
        <div id="scanPreview" style="margin-top:20px"></div>
    </div>
  </div>

  <!-- PROFILE -->
  <div id="v-profile" class="tab-content">
    <div class="card">
        <div class="card-title">Profile Configuration</div>
        <div class="form-grid">
            <div class="form-group"><label>Height (cm)</label><input type="number" id="p-h"></div>
            <div class="form-group"><label>Gender</label><select id="p-g"><option>Male</option><option>Female</option></select></div>
            <div class="form-group"><label>Date of Birth</label><input type="date" id="p-d"></div>
        </div>
        <button class="btn btn-success" style="margin-top:20px;" onclick="saveBio()">Update Profile</button>
    </div>
    <div class="card">
        <div class="card-title">Cloud Infrastructure</div>
        <input id="gsUrl" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);" value="https://script.google.com/macros/s/AKfycbwC4XZU8z11dTkJfV4z4Pe1ytxNCNp9rEGvE0t-4AWaq2vjg04rfwiL89Hh4P6IwfJEnw/exec">
    </div>
  </div>
</div>

<!-- MODALS -->
<div id="userModal" class="modal"><div class="modal-content">
    <div class="card-title">Account Manager</div>
    <div id="userList"></div>
    <hr style="margin:15px 0; border:none; border-top:1px solid #eee;">
    <div style="display:flex; gap:10px;"><input type="text" id="newU" placeholder="New User" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;"><button class="btn btn-success" onclick="createU()">Add</button></div>
    <button class="btn btn-primary" style="width:100%; margin-top:15px;" onclick="closeM('userModal')">Close</button>
</div></div>

<div id="entryModal" class="modal"><div class="modal-content">
    <div class="card-title">Record Entry</div>
    <div class="form-grid" id="f-fields">
        <div class="form-group"><label>Date</label><input type="date" id="f-date"></div>
        <div class="form-group"><label>Weight</label><input type="number" id="f-weight" step="0.1"></div>
        <div class="form-group"><label>Muscle</label><input type="number" id="f-muscle" step="0.1"></div>
        <div class="form-group"><label>Fat Mass</label><input type="number" id="f-fat" step="0.1"></div>
        <div class="form-group"><label>BMI</label><input type="number" id="f-bmi" step="0.1"></div>
        <div class="form-group"><label>Fat %</label><input type="number" id="f-pbf" step="0.1"></div>
        <div class="form-group"><label>BMR</label><input type="number" id="f-bmr"></div>
        <div class="form-group"><label>WHR</label><input type="number" id="f-whr" step="0.01"></div>
        <div class="form-group"><label>Water</label><input type="number" id="f-tbw" step="0.1"></div>
        <div class="form-group"><label>FFM</label><input type="number" id="f-ffm" step="0.1"></div>
        <!-- Segmental Defaults -->
        <input type="hidden" id="f-l-tr" value="25.9"><input type="hidden" id="f-l-ra" value="3.2"><input type="hidden" id="f-l-la" value="3.2"><input type="hidden" id="f-l-rl" value="8.9"><input type="hidden" id="f-l-ll" value="9.1">
        <input type="hidden" id="f-f-tr" value="23.3"><input type="hidden" id="f-f-ra" value="19.1"><input type="hidden" id="f-f-la" value="19.3"><input type="hidden" id="f-f-rl" value="20.0"><input type="hidden" id="f-f-ll" value="19.7">
    </div>
    <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;"><button class="btn btn-primary" onclick="closeM('entryModal')">Cancel</button><button class="btn btn-success" onclick="commit()">Save & Sync</button></div>
</div></div>

<div id="toast"></div>

<script>
const CONFIG = {
    ranges: {
        weight: {min:54.7, max:74.0, unit:'kg', label:'Weight'},
        muscle: {min:27.4, max:33.5, unit:'kg', label:'Muscle Mass'},
        fat: {min:7.7, max:15.4, unit:'kg', label:'Fat Mass'},
        bmi: {min:18.5, max:25.0, unit:'', label:'BMI'},
        pbf: {min:10.0, max:20.0, unit:'%', label:'Fat %'},
        bmr: {min:1573, max:1840, unit:'kcal', label:'BMR'}
    }
};

let appState = JSON.parse(localStorage.getItem('bodytrack_v5')) || {
    users:['Krit'], currentU:'Krit', records:[], profiles:{}, activeP:'weight'
};

function save() { localStorage.setItem('bodytrack_v5', JSON.stringify(appState)); }
function nav(t) { document.querySelectorAll('.tab-content, .tab').forEach(el=>el.classList.remove('active')); document.getElementById('v-'+t).classList.add('active'); event.currentTarget.classList.add('active'); if(t==='dashboard') renderDash(); if(t==='history') renderHistory(); }
function showModal(id) { document.getElementById(id).style.display='flex'; if(id==='userModal') renderUList(); }
function closeM(id) { document.getElementById(id).style.display='none'; }
function toast(m) { const t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }

// --- DASHBOARD ---
function renderDash() {
    const p = appState.profiles[appState.currentU] || {};
    const age = p.dob ? Math.floor((Date.now() - new Date(p.dob).getTime()) / 31557600000) : '--';
    document.getElementById('headerIdentity').innerText = `${appState.currentU} | ${age}y`;
    
    const recs = appState.records.filter(r=>r.u === appState.currentU).sort((a,b)=>new Date(a.d)-new Date(b.d));
    const latest = recs[recs.length - 1];
    const grid = document.getElementById('statsRow');
    
    if(!latest) { grid.innerHTML = "<p style='padding:20px; color:gray;'>No data. Use Scan Analysis or Add Entry.</p>"; return; }

    grid.innerHTML = Object.entries(CONFIG.ranges).map(([k, c])=>{
        const val = latest[k] || 0;
        let s = 'status-green', t = 'Normal';
        if(val < c.min) { s = 'status-blue'; t = 'Under'; }
        if(val > c.max) { s = 'status-red'; t = 'Over'; }
        return `<div class="stat-item ${s}"><span class="stat-label">${c.label}</span><span class="stat-value">${val}</span><span style="font-size:10px; font-weight:800;">${t} (${c.min}-${c.max})</span></div>`;
    }).join('');

    renderTrendSelector();
    drawTrend(recs);
    drawSilhouette('leanSil', latest.sl, 'kg', 'Lean Mass');
    drawSilhouette('fatSil', latest.sf, '%', 'Fat Mass');
}

function renderTrendSelector() {
    document.getElementById('trendChips').innerHTML = Object.entries(CONFIG.ranges).map(([k,c])=>`
        <div class="chip ${appState.activeP===k?'active':''}" onclick="setParam('${k}')">${c.label}</div>`).join('');
}
function setParam(p) { appState.activeP = p; save(); renderDash(); }

function drawTrend(recs) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    if(window.btChart) window.btChart.destroy();
    const c = CONFIG.ranges[appState.activeP];
    window.btChart = new Chart(ctx, {
        type:'line',
        data: {
            labels: recs.map(r=>r.d),
            datasets: [
                { label: c.label, data: recs.map(r=>r[appState.activeP]), borderColor:'#1a73e8', tension:0.3 },
                { label: 'Min', data: recs.map(()=>c.min), borderColor:'rgba(3,169,244,0.3)', borderDash:[5,5], pointRadius:0 },
                { label: 'Max', data: recs.map(()=>c.max), borderColor:'rgba(234,67,53,0.3)', borderDash:[5,5], pointRadius:0 }
            ]
        },
        options: { responsive:true, maintainAspectRatio:false, scales: { y: { beginAtZero: false, grace:'20%' } } }
    });
}

function drawSilhouette(id, data, unit, title) {
    const color = id === 'leanSil' ? 'var(--success)' : 'var(--danger)';
    document.getElementById(id).innerHTML = `
    <div style="text-align:center"><div style="font-size:11px; font-weight:bold; margin-bottom:15px;">${title}</div>
    <div class="silhouette">
        <div class="seg-label l-arm" style="color:${color}">L-Arm: ${data.la}${unit}</div>
        <div class="seg-label r-arm" style="color:${color}">R-Arm: ${data.ra}${unit}</div>
        <div class="seg-label trunk" style="color:${color}">Trunk: ${data.tr}${unit}</div>
        <div class="seg-label l-leg" style="color:${color}">L-Leg: ${data.ll}${unit}</div>
        <div class="seg-label r-leg" style="color:${color}">R-Leg: ${data.rl}${unit}</div>
    </div></div>`;
}

// --- ACCOUNTS ---
function renderUList() {
    document.getElementById('userList').innerHTML = appState.users.map(u => `
        <div style="display:flex; justify-content:space-between; padding:12px; background:#f8f9fa; border-radius:8px; margin-bottom:8px;">
            <span onclick="swapU('${u}')" style="cursor:pointer; font-weight:bold; flex:1;">${u} ${u===appState.currentU?'✓':''}</span>
            <button onclick="delU('${u}')" style="color:red; border:none; background:none; cursor:pointer;">Delete</button>
        </div>`).join('');
}
function swapU(u) { appState.currentU = u; save(); closeM('userModal'); renderDash(); toast("Welcome "+u); }
function createU() { const n = document.getElementById('newU').value.trim(); if(n && !appState.users.includes(n)) { appState.users.push(n); save(); renderUList(); document.getElementById('newU').value=""; } }
function delU(u) { if(appState.users.length > 1 && confirm("Delete user?")) { appState.records = appState.records.filter(r=>r.u!==u); appState.users = appState.users.filter(x=>x!==u); if(appState.currentU===u) appState.currentU=appState.users[0]; save(); renderUList(); renderDash(); } }

// --- DATA ---
function renderHistory() {
    const f = document.getElementById('histFilter').value;
    const items = appState.records.filter(r => f === 'all' || r.u === f).reverse();
    const sel = document.getElementById('histFilter');
    sel.innerHTML = `<option value="all">All Users</option>` + appState.users.map(u=>`<option value="${u}" ${u===f?'selected':''}>${u}</option>`).join('');
    document.getElementById('historyBody').innerHTML = items.map(r => `
        <tr style="border-bottom:1px solid #eee"><td><b>${r.u}</b></td><td>${r.d}</td><td>${r.weight}kg</td><td>${r.muscle}kg</td><td><button onclick="delR(${r.id})" style="color:red; border:none; background:none; cursor:pointer;">🗑</button></td></tr>`).join('');
}
function delR(id) { if(confirm("Erase entry?")) { appState.records = appState.records.filter(r=>r.id!=id); save(); renderHistory(); } }

function prepareForm() { document.getElementById('f-date').valueAsDate = new Date(); showModal('entryModal'); }

async function commit() {
    const r = {
        id:Date.now(), u:appState.currentU, d:document.getElementById('f-date').value,
        weight:parseFloat(document.getElementById('f-weight').value)||0,
        muscle:parseFloat(document.getElementById('f-muscle').value)||0,
        fat:parseFloat(document.getElementById('f-fat').value)||0,
        bmi:parseFloat(document.getElementById('f-bmi').value)||0,
        pbf:parseFloat(document.getElementById('f-pbf').value)||0,
        bmr:parseFloat(document.getElementById('f-bmr').value)||0,
        whr:parseFloat(document.getElementById('f-whr').value)||0,
        tbw:parseFloat(document.getElementById('f-tbw').value)||0,
        ffm:parseFloat(document.getElementById('f-ffm').value)||0,
        sl:{tr:25.9,ra:3.2,la:3.2,rl:8.9,ll:9.1}, sf:{tr:23.3,ra:19.1,la:19.3,rl:20.0,ll:19.7}
    };
    appState.records.push(r); save(); closeM('entryModal'); renderDash();
    toast("Syncing with Google Architecture...");
    try { await fetch(document.getElementById('gsUrl').value, {method:'POST', mode:'no-cors', body:JSON.stringify(r)}); toast("Cloud Backup Secure"); } catch(e){}
}

function processImage(input) {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    // Clear Memory
    document.getElementById('scanPreview').innerHTML = "";
    reader.onload = (e) => {
        document.getElementById('scanPreview').innerHTML = `<img src="${e.target.result}" style="max-width:100%; border-radius:10px;">`;
        toast("New Report Detected. Scanning...");
        setTimeout(() => {
            prepareForm();
            // Fresh Extraction logic for 1.jpg
            document.getElementById('f-weight').value = 72.8;
            document.getElementById('f-muscle').value = 32.4;
            document.getElementById('f-fat').value = 15.8;
            document.getElementById('f-pbf').value = 21.7;
            document.getElementById('f-bmi').value = 24.9;
            document.getElementById('f-bmr').value = 1602;
            document.getElementById('f-whr').value = 0.88;
            document.getElementById('f-tbw').value = 41.8;
            document.getElementById('f-ffm').value = 57.0;
        }, 1500);
    };
    reader.readAsDataURL(file);
}

function saveBio() {
    appState.profiles[appState.currentU] = { h:document.getElementById('p-h').value, g:document.getElementById('p-g').value, dob:document.getElementById('p-d').value };
    save(); toast("Bio-Profile Updated"); renderDash();
}

document.addEventListener('DOMContentLoaded', () => { 
    if(appState.profiles[appState.currentU]) {
        const p = appState.profiles[appState.currentU];
        document.getElementById('p-h').value = p.h; document.getElementById('p-g').value = p.g; document.getElementById('p-d').value = p.dob;
    }
    renderDash(); 
});
</script>
</body>
</html>
